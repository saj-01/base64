<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>b64.io | Minimalist Base64</title>
  <meta name="description" content="Minimalist 100dvh real-time Base64 link encoder and decoder with a Matrix rain aesthetic.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fixed Slow Matrix Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Strict 100dvh Non-Scrolling Viewport -->
  <div class="app-viewport">
    <!-- Sleek Minimalist Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-code">&lt;b64&gt;</span>
        <span class="pulse-dot"></span>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-btn-minimal" id="btn-clear-all" title="Clear All Fields">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn-minimal" id="btn-settings" title="Settings & History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Dual Editor Section -->
    <main class="editor-main">
      <!-- Top Field: Base64 Card -->
      <div class="card editor-card" id="card-b64">
        <div class="card-bar">
          <div class="card-label">
            <span class="dot violet-dot"></span>
            <span class="label-text" id="label-top">BASE64 STRING</span>
          </div>
          <div class="card-tools">
            <button type="button" class="tool-link" id="btn-paste-b64" title="Paste">PASTE</button>
            <button type="button" class="tool-link highlight" id="btn-copy-b64" title="Copy">COPY</button>
          </div>
        </div>
        <textarea id="b64-text" placeholder="Base64 input string..." spellcheck="false"></textarea>
        <div class="card-footer">
          <span class="counter" id="b64-counter">0 chars</span>
          <span class="status-badge" id="b64-status">READY</span>
        </div>
      </div>

      <!-- Bottom Field: Plain Text / Link Card -->
      <div class="card editor-card" id="card-text">
        <div class="card-bar">
          <div class="card-label">
            <span class="dot cyan-dot"></span>
            <span class="label-text" id="label-bottom">PLAIN TEXT / LINK</span>
          </div>
          <div class="card-tools">
            <button type="button" class="tool-link" id="btn-paste-text" title="Paste">PASTE</button>
            <button type="button" class="tool-link highlight" id="btn-copy-text" title="Copy">COPY</button>
          </div>
        </div>
        <textarea id="plain-text" placeholder="Normal text or link..." spellcheck="false"></textarea>
        <div class="card-footer">
          <span class="counter" id="text-counter">0 chars</span>
          <span class="status-badge" id="text-status">READY</span>
        </div>
      </div>
    </main>

    <!-- Sleek Cyberpunk Detected Link Banner -->
    <div class="detected-link-bar hidden" id="link-preview-card">
      <div class="detected-link-info">
        <span class="url-label">DETECTED URL</span>
        <a href="#" id="detected-url-link" target="_blank" rel="noopener noreferrer" class="url-text">https://...</a>
      </div>
      <div class="detected-link-actions">
        <button type="button" class="btn-micro" id="btn-copy-detected">COPY</button>
        <a href="#" id="btn-open-detected" target="_blank" rel="noopener noreferrer" class="btn-micro primary">OPEN &nearr;</a>
      </div>
    </div>
  </div>

  <!-- Hidden Settings & History Drawer / Modal -->
  <div class="modal-backdrop hidden" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>CONFIG & HISTORY</h3>
        <button type="button" class="modal-close" id="btn-close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Toggles & Options -->
        <div class="option-row">
          <div class="option-info">
            <span class="option-title">URL-Safe Base64</span>
            <span class="option-desc">Replace +/ with -_ and remove padding =</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="opt-url-safe" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="option-buttons">
          <button type="button" class="btn-option" id="btn-sample">Try Sample Link</button>
          <button type="button" class="btn-option danger" id="btn-clear-history">Clear History</button>
        </div>

        <!-- History -->
        <div class="history-container">
          <div class="history-title">RECENT CONVERSIONS</div>
          <div class="history-list" id="history-list">
            <div class="history-empty">No recent conversions</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite">
    <span id="toast-message">Copied</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
